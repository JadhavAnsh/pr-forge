name: Nightly Build

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  nightly-build:
    name: Nightly Build - ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            
          - os: macOS
            runs-on: macos-latest
            target: x86_64-apple-darwin
            
          - os: Windows
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      
      - name: Install Linux dependencies
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev libssh2-1-dev pkg-config
      
      - name: Install macOS dependencies
        if: matrix.os == 'macOS'
        run: |
          brew install libgit2 libssh2
      
      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build with nightly
        run: cargo build --release --target ${{ matrix.target }}
        continue-on-error: true
      
      - name: Report results
        run: |
          echo "Nightly build for ${{ matrix.os }} completed"
          echo "Check logs for any compiler warnings or errors"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: rustsec/audit-check-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create issue on vulnerability
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Security: Vulnerable dependency detected',
              body: 'A security audit found vulnerable dependencies. Please update dependencies.'
            })

  dependency-check:
    name: Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Check outdated dependencies
        run: |
          cargo install cargo-outdated || true
          cargo outdated --format list || true
      
      - name: Check unused dependencies
        run: |
          cargo install cargo-udeps || true
          cargo +nightly udeps --all-targets || true
