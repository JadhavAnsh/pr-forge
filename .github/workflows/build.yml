name: Cross-Platform Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pr-forge
            
          - os: macOS
            runs-on: macos-latest
            target: x86_64-apple-darwin
            artifact: pr-forge
            
          - os: macOS ARM64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            artifact: pr-forge
            
          - os: Windows
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pr-forge.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Install Linux dependencies
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libgit2-dev \
            libssh2-1-dev

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macOS')
        run: |
          brew install libgit2 libssh2 openssl

      - name: Run cargo check
        run: cargo check --target ${{ matrix.target }} --verbose

      - name: Run tests
        run: cargo test --target ${{ matrix.target }} --verbose

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.artifact }} || true

      - name: Create artifact directory (Linux/macOS)
        if: matrix.os != 'Windows'
        run: mkdir -p artifacts

      - name: Create artifact directory (Windows)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null

      - name: Copy binary (Linux/macOS)
        if: matrix.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact }} artifacts/

      - name: Copy binary (Windows)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: Copy-Item -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -Destination "artifacts/" -Force

      - name: Create release archive (Linux)
        if: matrix.os == 'Linux'
        run: |
          cd artifacts
          tar -czf pr-forge-linux-x86_64.tar.gz pr-forge
          cd ..

      - name: Create release archive (macOS)
        if: startsWith(matrix.os, 'macOS')
        run: |
          cd artifacts
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            tar -czf pr-forge-macos-arm64.tar.gz pr-forge
          else
            tar -czf pr-forge-macos-x86_64.tar.gz pr-forge
          fi
          cd ..

      - name: Create release archive (Windows)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/pr-forge.exe -DestinationPath artifacts/pr-forge-windows-x86_64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: pr-forge-${{ matrix.os }}
          path: artifacts/
          retention-days: 30

      - name: Display build info (Linux/macOS)
        if: matrix.os != 'Windows'
        run: |
          echo "Build completed for ${{ matrix.os }}"
          echo "Target: ${{ matrix.target }}"
          ls -la artifacts/

      - name: Display build info (Windows)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output "Build completed for ${{ matrix.os }}"
          Write-Output "Target: ${{ matrix.target }}"
          Get-ChildItem -Path artifacts | Format-Table -AutoSize

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libgit2-dev \
            libssh2-1-dev
      
      - name: Run all tests
        run: cargo test --verbose
      
      - name: Run clippy
        run: cargo clippy -- -D warnings

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libgit2-dev \
            libssh2-1-dev
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  release:
    name: Create Release
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.author.name != 'dependabot[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: all-artifacts
      
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Linux
          if [ -d "all-artifacts/pr-forge-Linux" ]; then
            cp all-artifacts/pr-forge-Linux/*.tar.gz release-assets/ || true
          fi
          
          # macOS
          if [ -d "all-artifacts/pr-forge-macOS" ]; then
            cp all-artifacts/pr-forge-macOS/*.tar.gz release-assets/ || true
          fi
          
          # macOS ARM64
          if [ -d "all-artifacts/pr-forge-macOS ARM64" ]; then
            cp "all-artifacts/pr-forge-macOS ARM64"/*.tar.gz release-assets/ || true
          fi
          
          # Windows
          if [ -d "all-artifacts/pr-forge-Windows" ]; then
            cp all-artifacts/pr-forge-Windows/*.zip release-assets/ || true
          fi
          
          ls -la release-assets/
      
      - name: Create Release Notes
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "# PR-Forge Release" > release_notes.md
          echo "" >> release_notes.md
          echo "**Commit:** $(git rev-parse --short HEAD)" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Message:**" >> release_notes.md
          echo "$COMMIT_MSG" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Assets" >> release_notes.md
          echo "- Linux: \`pr-forge-linux-x86_64.tar.gz\`" >> release_notes.md
          echo "- macOS (Intel): \`pr-forge-macos-x86_64.tar.gz\`" >> release_notes.md
          echo "- macOS (ARM64): \`pr-forge-macos-arm64.tar.gz\`" >> release_notes.md
          echo "- Windows: \`pr-forge-windows-x86_64.zip\`" >> release_notes.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          body_path: release_notes.md
          tag_name: v${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Status
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ Build failed"
            exit 1
          else
            echo "✅ Build successful"
          fi
      
      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts available for download**" >> $GITHUB_STEP_SUMMARY
