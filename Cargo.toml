[package]
name = "pr-forge"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Git operations
git2 = "0.18"

# Text processing
regex = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client and async runtime
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1.35", features = ["rt", "sync"] }

# Environment variables
dotenv = "0.15"

# Utilities
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
rand = "0.8"
